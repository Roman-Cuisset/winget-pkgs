name: Validate OctetLedger WinGet upgrade

on:
  push:
    branches: [validate-octetledger-winget-0.11.1]

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test fresh installation and upgrade from the WinGet catalogue
        shell: pwsh
        env:
          WINGET_TEST_ARCH: ${{ matrix.arch }}
        run: |
          # Set the repository variables after publishing v0.11.1, from the released executable in each ARCHIVE.
          $expected = if ('${{ matrix.arch }}' -eq 'x64') {
            '${{ vars.OCTETLEDGER_0111_EXE_SHA_X64 }}'
          } else {
            '${{ vars.OCTETLEDGER_0111_EXE_SHA_ARM64 }}'
          }
          ./verify-winget-upgrade.ps1 -ExpectedExecutableSha256 $expected

      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: winget-upgrade-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: warn
